name: Daily menu scrape

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC every day (about 5am in Champaign)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  issues: write             # to open an issue when the scrape fails

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: Project/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Project/backend/requirements.txt

      - run: pip install -r requirements.txt

      # Scrapes today + the next 6 days so menu changes get picked up.
      # Exits non-zero if nothing was scraped or any request failed.
      - name: Scrape menus into the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scraper.menu_scraper --days 7

      - name: Open an issue if the scrape failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Daily menu scrape failed ($(date -u +%F))" \
            --body "The scheduled scrape failed. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
